<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静電気・磁力シミュレーター（ボタン追加版）</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            color: #fff;
            font-family: sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            border: 1px solid #444;
            background-color: #1e1e1e;
        }
        .control-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* ボタン用のスタイル */
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #startStopBtn {
            background-color: #4caf50;
            color: white;
        }
        #startStopBtn.paused {
            background-color: #f44336;
        }
        #resetBtn {
            background-color: #555;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }

        .control-group {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #4caf50;
        }
        .control-group.blue { border-left-color: #2196f3; }
        .control-group.red { border-left-color: #f44336; }
        
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #ddd; }
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        input[type="range"] { width: 100%; margin-top: 5px; }
        span.value-display { font-weight: bold; color: #4caf50; }
        .red span.value-display { color: #f44336; }
        .blue span.value-display { color: #2196f3; }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="simCanvas" width="700" height="600"></canvas>

        <div class="control-panel">
            <h2>シミュレーション</h2>
            
            <div class="button-group">
                <button id="startStopBtn">スタート</button>
                <button id="resetBtn">リセット</button>
            </div>
            
            <div class="control-group">
                <h3>空間の定数</h3>
                <label>クーロン力係数 (k): <span id="kCoulombVal" class="value-display">50000</span></label>
                <input type="range" id="kCoulomb" min="0" max="150000" step="5000" value="50000">
                
                <label style="margin-top: 10px;">一様磁場 (Bz): <span id="magFieldVal" class="value-display">2.0</span> T</label>
                <input type="range" id="magField" min="-5" max="5" step="0.5" value="2.0">
            </div>

            <div class="control-group red">
                <h3>粒子1 (赤)</h3>
                <label>電荷量 (q1): <span id="q1Val" class="value-display">5</span></label>
                <input type="range" id="q1" min="-10" max="10" step="1" value="5">
            </div>

            <div class="control-group blue">
                <h3>粒子2 (青)</h3>
                <label>電荷量 (q2): <span id="q2Val" class="value-display">-5</span></label>
                <input type="range" id="q2" min="-10" max="10" step="1" value="-5">
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
